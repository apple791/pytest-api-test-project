name: Run Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-and-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: test
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Offline configuration checks
        run: python -m pytest test_cases/unit test_cases/config -v --junitxml=reports/config.xml
      - name: Public API and isolated SQLite practice
        run: >-
          python -m pytest test_cases/api test_cases/db/test_api_db_check.py
          -v --html=reports/ci-report.html --self-contained-html
          --junitxml=reports/ci-results.xml --alluredir=reports/allure-results
      - name: Upload reports even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-test-reports
          path: reports/
          if-no-files-found: warn
