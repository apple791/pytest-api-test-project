# 1.文章创建接口用例
post_cases:
  - case_name: "正常创建文章-用户1"
    marks:
      - "smoke"
    payload:
      title: "learn api test"
      body: "this is day 5"
      userId: 1
    expected:
      status_code: 201
      title: "learn api test"
      body: "this is day 5"
      userId: 1
      has_id: true

  - case_name: "正常创建文章-用户2"
    marks: []
    payload:
      title: "second case"
      body: "hello yaml"
      userId: 2
    expected:
      status_code: 201
      title: "second case"
      body: "hello yaml"
      userId: 2
      has_id: true


# 2.根据用户 ID 查询文章列表接口用例
get_cases:
  - case_name: "查询用户1文章"
    marks:
      - "smoke"
    params:
      userId: 1
    expected:
      status_code: 200
      userId: 1
      data_type: "list"
      not_empty: true

  - case_name: "查询用户2文章"
    marks: []
    params:
      userId: 2
    expected:
      status_code: 200
      userId: 2
      data_type: "list"
      not_empty: true

  - case_name: "查询用户3文章"
    marks:
      - "smoke"
    params:
      userId: 3
    expected:
      status_code: 200
      userId: 3
      data_type: "list"
      not_empty: true


# 3.文章接口流程用例：先查询文章列表，再提取第一篇文章 ID 查询详情
flow_cases:
  - case_name: "查询用户1文章列表并查看第一篇详情"
    params:
      userId: 1
    expected:
      userId: 1
      list_status_code: 200
      detail_status_code: 200
      data_type: "list"
      not_empty: true
      required_fields:
        - "title"
        - "body"

  - case_name: "查询用户2文章列表并查看第一篇详情"
    params:
      userId: 2
    expected:
      userId: 2
      list_status_code: 200
      detail_status_code: 200
      data_type: "list"
      not_empty: true
      required_fields:
        - "title"
        - "body"

  - case_name: "查询用户3文章列表并查看第一篇详情"
    params:
      userId: 3
    expected:
      userId: 3
      list_status_code: 200
      detail_status_code: 200
      data_type: "list"
      not_empty: true
      required_fields:
        - "title"
        - "body"


# 4.查询不存在文章 ID 的异常用例
negative_cases:
  - case_name: "查询不存在文章id-999999"
    post_id: 999999
    expected:
      status_code: 404
      response_body: {}

  - case_name: "查询不存在文章id-0"
    post_id: 0
    expected:
      status_code: 404
      response_body: {}

  - case_name: "查询非法文章id-abc"
    post_id: "abc"
    expected:
      status_code: 404
      response_body: {}


# 5.请求不存在接口路径的异常用例
wrong_path_cases:
  - case_name: "请求不存在接口路径"
    path: "/wrong_api"
    expected:
      status_code: 404
      response_body: {}


# 6.Headers 测试用例：校验服务端是否收到自定义 headers
headers_cases:
  - case_name: "发送自定义headers"
    headers:
      User-Agent: "api-test-demo"
      Authorization: "Bearer fake-token"
    expected:
      status_code: 200
      headers:
        User-Agent: "api-test-demo"
        Authorization: "Bearer fake-token"


# 7.Bearer Token 鉴权用例：覆盖携带 Token 成功和未携带 Token 失败
bearer_cases:
  - case_name: "带Authorization预期成功"
    headers:
      User-Agent: "api-test-demo"
      Authorization: "Bearer fake-token"
    expected:
      status_code: 200
      authenticated: true
      token: "fake-token"

  - case_name: "不带Authorization预期失败"
    headers: null
    expected:
      status_code: 401


# 8.Session + Cookie 用例：验证 Session 自动保存并携带服务端返回的 Cookie
session_cases:
  - case_name: "服务端设置Cookie后Session自动保存"
    cookie_name: "session_id"
    cookie_value: "abc123"
    expected:
      status_code: 200
      cookie_name: "session_id"
      cookie_value: "abc123"


# 9.请求失败重试用例：验证指定状态码是否触发重试
retry_cases:
  - case_name: "500状态码触发重试"
    url: "https://httpbin.org/status/500"
    retry_times: 3
    retry_status_codes:
      - 500
      - 502
      - 503
      - 504
    expected:
      status_code: 500

  - case_name: "404状态码不触发重试"
    url: "https://httpbin.org/status/404"
    retry_times: 3
    retry_status_codes:
      - 500
      - 502
      - 503
      - 504
    expected:
      status_code: 404
